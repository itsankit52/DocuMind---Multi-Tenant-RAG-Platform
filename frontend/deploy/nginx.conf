# Static server for the DocuMind SPA (runs unprivileged inside the frontend container).
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    off; # the edge proxy logs every request with its X-Request-Id

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Fingerprinted build assets are immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback; index.html itself must never be cached so deploys/rollbacks take effect.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
