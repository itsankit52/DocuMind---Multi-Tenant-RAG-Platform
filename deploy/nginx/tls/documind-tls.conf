# HTTPS configuration. Certificates are NOT generated or committed: mount them at
#   /etc/nginx/certs/fullchain.pem  and  /etc/nginx/certs/privkey.pem
# (e.g. from Let's Encrypt / certbot or your CA). See docs/DEPLOYMENT.md → "HTTPS".
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  # ACME HTTP-01 challenges (optional: mount a webroot at /var/www/acme)
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS is sent via snippets/security-headers.conf ($documind_hsts is set for https).
  include /etc/nginx/snippets/app-locations.conf;
}
