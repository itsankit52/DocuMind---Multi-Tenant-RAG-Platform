# DocuMind edge reverse proxy — the only publicly exposed service.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  tcp_nodelay   on;
  keepalive_timeout 65s;

  # Correlation ID: keep a safe client X-Request-Id, otherwise use Nginx's own $request_id.
  # The API applies the same allow-list and echoes the final ID in its X-Request-Id header.
  map $http_x_request_id $documind_request_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default                     $request_id;
  }

  # HSTS only on HTTPS (an empty value suppresses the header on plain HTTP).
  map $scheme $documind_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
  }

  # Keep upstream connections alive.
  upstream documind_api      { server api:3000;      keepalive 32; }
  upstream documind_frontend { server frontend:8080; keepalive 8;  }

  # Structured JSON access log (no query strings, cookies, auth headers or bodies).
  log_format documind_json escape=json
    '{"time":"$time_iso8601","service":"documind-nginx","request_id":"$documind_request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';
  access_log /dev/stdout documind_json;

  client_max_body_size 1m;          # raised only for document upload (snippets/api-locations.conf)
  client_body_timeout  60s;
  client_header_timeout 30s;
  send_timeout 60s;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  # text/event-stream is intentionally NOT gzipped: compression buffers SSE tokens.

  include /etc/nginx/conf.d/*.conf;
}
