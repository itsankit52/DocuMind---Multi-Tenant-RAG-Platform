# Shared by the HTTP and HTTPS server blocks.
# NOTE: add_header in a location replaces inherited ones, so every location re-includes
# security-headers.conf (which also emits HSTS when the request is HTTPS).

# ── SSE: chat token streaming ────────────────────────────────────────────────
# POST /api/conversations/:id/messages/stream  → text/event-stream
location ~ ^/api/conversations/[^/]+/messages/stream$ {
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://documind_api;

  proxy_buffering off;              # forward each token as soon as the API flushes it
  proxy_cache off;
  proxy_request_buffering off;
  gzip off;
  chunked_transfer_encoding on;
  proxy_read_timeout 300s;          # > CHAT_STREAM_TIMEOUT_MS; SSE heartbeats every 15s keep it alive
  proxy_send_timeout 300s;
  proxy_connect_timeout 5s;
  client_max_body_size 64k;
}

# ── Document upload (multipart, MAX_FILE_SIZE_MB=10 + multipart overhead) ─────
location = /api/documents {
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://documind_api;
  client_max_body_size 12m;
  proxy_request_buffering on;       # absorb slow uploads before they reach Node
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

# ── REST API ─────────────────────────────────────────────────────────────────
location /api/ {
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://documind_api;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;          # non-streaming RAG answers can take a while on CPU Ollama
  proxy_send_timeout 60s;
}

# ── Health: liveness only is public; /health/ready (dependency detail) stays internal ──
location = /health/live {
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://documind_api;
  access_log off;
}
location = /nginx-health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Prometheus metrics and readiness detail are never served publicly.
location = /metrics      { return 404; }
location ^~ /health/     { return 404; }

# ── SPA static assets ────────────────────────────────────────────────────────
location / {
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_pass http://documind_frontend;
}
