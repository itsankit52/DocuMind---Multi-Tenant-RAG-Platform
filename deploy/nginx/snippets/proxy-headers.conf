proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Express trusts exactly TRUST_PROXY hops of this header (rate limiting uses the client IP).
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# If an external load balancer terminates TLS, replace $scheme with $http_x_forwarded_proto
# (only when that LB is the sole path to Nginx) — see docs/DEPLOYMENT.md "External TLS".
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $documind_request_id;
# The API echoes X-Request-Id; hide it so the single value comes from security-headers.conf
# (identical, since the same ID is forwarded upstream) instead of a duplicated header.
proxy_hide_header X-Request-Id;
