# HTTP server. Used for local production-like verification and when TLS is terminated by an
# external load balancer. For direct HTTPS, use deploy/docker-compose.tls.yml, which replaces
# this file with tls/documind-tls.conf (HTTP → HTTPS redirect + TLS server).
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  include /etc/nginx/snippets/app-locations.conf;
}
