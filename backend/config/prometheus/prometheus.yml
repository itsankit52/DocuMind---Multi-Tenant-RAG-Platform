# DocuMind Prometheus configuration (Step 13)
# The API and worker run on the host during development; containers reach them via
# host.docker.internal. Targets live in targets/*.json (file-based discovery, re-read
# every 30s; file-change events do not reach Docker Desktop bind mounts on Windows)
# so ports can be changed without restarting Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: documind-api
    metrics_path: /metrics
    # If METRICS_TOKEN is set on the API, uncomment and mount the token file:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/api.json]
        refresh_interval: 30s

  - job_name: documind-worker
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/worker.json]
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
