# DocuMind — production deployment (Step 14)
#
#   cp .env.production.example .env.production   # fill in real secrets (never commit)
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Standalone file (not an override of backend/docker-compose.yml): the development compose
# publishes every data-store port and uses fixed container names + dev credentials, which an
# override cannot cleanly remove. Separate project name => separate containers and volumes.
#
# Only Nginx is public. Prometheus/Grafana bind to 127.0.0.1 (admin via SSH tunnel).
# Everything else is reachable only on the internal Docker networks by service name.

name: documind-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend-env: &backend-env
  NODE_ENV: production
  DOTENV_CONFIG_QUIET: "true"     # no .env exists in the image; silence dotenv's banner
  PORT: "3000"
  TRUST_PROXY: "${TRUST_PROXY:-1}"
  SHUTDOWN_TIMEOUT_MS: "20000"
  # Runtime role: NOSUPERUSER, RLS enforced via SET LOCAL ROLE documind_app (see migrations/007)
  DATABASE_URL: "postgresql://documind_runtime:${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-documind}"
  DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-20}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
  JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
  JWT_ACCESS_EXPIRATION: "${JWT_ACCESS_EXPIRATION:-15m}"
  JWT_REFRESH_EXPIRATION: "${JWT_REFRESH_EXPIRATION:-7d}"
  COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET is required}"
  CORS_ORIGIN: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required (e.g. https://documind.example.com)}"
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
  MINIO_BUCKET: "${MINIO_BUCKET:-documind-documents}"
  MAX_FILE_SIZE_MB: "10"
  RABBITMQ_URL: "amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672"
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
  QDRANT_COLLECTION: documind_chunks
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
  OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.2:1b}"
  EMBEDDING_DIMENSION: "768"
  METRICS_ENABLED: "true"
  METRICS_TOKEN: "${METRICS_TOKEN:-}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_FORMAT: json
  WORKER_METRICS_PORT: "9464"

networks:
  edge: {}                       # nginx <-> frontend/api
  data: { internal: true }       # data stores, api, worker: no internet egress, no published ports
  egress: {}                     # ollama model downloads only
  monitoring: {}                 # prometheus <-> grafana, 127.0.0.1-published admin UIs

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  ollama_models:
    # Set OLLAMA_MODELS_VOLUME to reuse an existing volume that already holds the models.
    # external: true silences the "created for project X" warning when OLLAMA_MODELS_VOLUME
    # names a volume that belongs to another Compose project (e.g. the dev stack).
    name: ${OLLAMA_MODELS_VOLUME:-documind-prod_ollama_models}
    external: true

services:
  # ── Data stores ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-documind_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-documind}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPUS:-1}", memory: "${POSTGRES_MEMORY:-1g}" }
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy volatile-ttl"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${REDIS_CPUS:-0.5}", memory: "${REDIS_MEMORY:-384m}" }
    logging: *logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    hostname: rabbitmq          # node name (and thus the data directory) must be stable
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${RABBITMQ_CPUS:-1}", memory: "${RABBITMQ_MEMORY:-512m}" }
    logging: *logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BROWSER: "off"      # no console in production; bucket stays private (no anonymous policy)
    volumes:
      - minio_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${MINIO_CPUS:-1}", memory: "${MINIO_MEMORY:-512m}" }
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]
    healthcheck:
      # Image has no curl/wget; /readyz is unauthenticated and reports real readiness.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${QDRANT_CPUS:-1}", memory: "${QDRANT_MEMORY:-1g}" }
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_models:/root/.ollama
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "${OLLAMA_CPUS:-4}", memory: "${OLLAMA_MEMORY:-3g}" }
    logging: *logging
    # GPU (optional, NVIDIA Container Toolkit required):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot: pulls only the models missing from the persistent volume.
  ollama-init:
    image: ollama/ollama:0.34.3
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODELS: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} ${OLLAMA_LLM_MODEL:-llama3.2:1b}"
    entrypoint: ["sh", "-c", "for m in $$MODELS; do if ollama show \"$$m\" >/dev/null 2>&1; then echo \"model $$m present\"; else echo \"pulling $$m\" && ollama pull \"$$m\" || exit 1; fi; done"]
    networks: [data, egress]
    logging: *logging

  # ── Application ─────────────────────────────────────────────────────────────
  # One-shot schema migration (tracked, transactional, advisory-locked). Runs as the owner role.
  migrate:
    build: { context: ./backend, target: api }
    image: documind-api:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["node", "migrate.js"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: "postgresql://${POSTGRES_USER:-documind_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-documind}"
      DB_RUNTIME_PASSWORD: "${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    healthcheck: { disable: true }
    logging: *logging

  api:
    build: { context: ./backend, target: api }
    image: documind-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      ollama:   { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    networks: [edge, data]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "${API_CPUS:-2}", memory: "${API_MEMORY:-1g}" }
    logging: *logging

  worker:
    build: { context: ./backend, target: worker }
    image: documind-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      ollama:   { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    networks: [data]
    stop_grace_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits: { cpus: "${WORKER_CPUS:-2}", memory: "${WORKER_MEMORY:-2g}" }
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: /api }
    image: documind-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:      { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # ── Observability (Step 13) — optional for the app; nothing depends on it ─────
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [data, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/documind-overview.json
    volumes:
      - ./backend/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
